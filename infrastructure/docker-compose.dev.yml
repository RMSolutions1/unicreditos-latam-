name: unicreditos-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unicreditos
      POSTGRES_PASSWORD: unicreditos_dev
      POSTGRES_DB: unicreditos
    ports:
      - "5432:5432"
    volumes:
      - unicreditos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicreditos -d unicreditos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unicreditos_postgres_data:
